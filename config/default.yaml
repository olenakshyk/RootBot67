# Default settings. Override locally in config/local.yaml (not committed).

robot:
  ip: "192.168.1.xxx"        # set in config/local.yaml
  speed_mm_s: 100            # TCP speed during play
  debug_speed_mm_s: 50       # TCP speed when testing new motion code
  acc_mm_s2: 500
  home_pose_mm: [300, 0, 300, 180, 0, 0]   # x, y, z, roll, pitch, yaw (deg) - TBD
  # Heights relative to table surface (table_z comes from calibration)
  heights_mm:
    safe: 80
    approach: 20
    grasp: 8                 # TBD: depends on piece height and gripper
    release: 2
  # Software workspace limits in robot base frame (second layer after xArm Studio safety boundary)
  workspace_mm:
    x: [100, 700]
    y: [-450, 450]
    z: [-20, 400]

camera:
  source: realsense          # realsense | folder
  folder: data/samples       # where to read frames from if source: folder
  index: 0
  resolution: [1920, 1080]
  intrinsics_file: config/calibration/camera.yaml

board:
  map_file: config/maps/autumn.yaml
  # No markers: keypoints of each frame are matched against a top-down reference image of the
  # empty board (made once by scripts/make_board_reference.py, not committed).
  reference_image: data/reference/board_autumn.png
  # Outer board size in mm [long side, short side], measured once. Origin: top-left board corner
  # with the ROOT logo top-right; X along the long side, Y down (towards the score track).
  size_mm: [570, 440]
  detector:                  # TBD: tune on real frames
    ratio_test: 0.75         # Lowe's ratio test for keypoint matches
    ransac_reproj_px: 3.0    # RANSAC inlier threshold, reference image px
    min_inliers: 40          # fewer -> board not found, fall back to the last good homography
    min_homography_det: 1.0e-9  # |det| below -> degenerate homography (board squashed to a line), not found
  max_shift_mm: 3            # board pose changed more than this since the last scan -> tell the operator
  warp_px_per_mm: 2
  board_to_robot_file: config/calibration/board_to_robot.yaml

vision:
  piece_model:               # vision/piece_detector_model.py; created once at startup
    type: stub               # stub | yolo
    weights: null            # trained weights (.pt) for type yolo; none yet — the model is in development
    device: cuda             # cuda | cpu (falls back to cpu if there is no GPU)
    classes:                 # model class NAME -> [faction or null, kind]; every model class must be listed
      marquise_warrior: [marquise_bot, warrior]
      eyrie_warrior: [eyrie, warrior]
      alliance_warrior: [alliance, warrior]
      vagabond: [vagabond, pawn]
      eyrie_building: [eyrie, building]
      alliance_building: [alliance, building]
      alliance_token: [alliance, token]
      marquise_keep_token: [marquise_bot, keep]
      marquise_score: [marquise_bot, score]
      eyrie_score: [eyrie, score]
      alliance_score: [alliance, score]
      vagabond_score: [vagabond, score]
      die: [null, die]
  min_confidence: 0.4        # boxes below are dropped

supply:
  # Slots of the bot's warrior tray, board frame (mm) - TBD after tray is printed
  slots_mm: []

game:
  dice: software             # software | manual
  birdsong:
    points_per_clearing: 2   # VP for each clearing the bot rules ...
    min_warriors: 3          # ... and where it has at least this many warriors
  move:
    stay_warriors: 3         # a ruled clearing with more warriors sends all but this many away
  recruit:
    total_warriors: 25       # all bot warriors; supply = this minus warriors on the map
  evening:
    schedule_size: 5         # draw order cards until the Schedule of Orders has this many
  traits:
    card_given_points: 1     # Poor Manual Dexterity: VP when a player would give the bot a card

startup:
  retries: 3                 # скільки разів повторити, якщо помилка тимчасова
  retry_delay_s: 2
