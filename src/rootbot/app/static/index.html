<!doctype html>
<html lang="en" data-time="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d86c48" />
    <title>RootBot</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact.js",
          "preact/hooks": "./vendor/preact-hooks.js",
          "htm": "./vendor/htm.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- Фільтр рваного краю й значки (власні малюнки, не з гри) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="torn" x="-5%" y="-10%" width="110%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <symbol id="i-fox" viewBox="0 0 40 40">
          <path fill="currentColor" d="M4 4 L14 14 Q20 12 26 14 L36 4 L34 20 Q31 30 20 37 Q9 30 6 20 Z" />
          <circle cx="14" cy="21" r="2.4" fill="#f6ecd2" />
          <circle cx="26" cy="21" r="2.4" fill="#f6ecd2" />
        </symbol>
        <symbol id="i-rabbit" viewBox="0 0 40 40">
          <ellipse cx="14" cy="11" rx="4.2" ry="10" fill="currentColor" transform="rotate(-10 14 11)" />
          <ellipse cx="26" cy="11" rx="4.2" ry="10" fill="currentColor" transform="rotate(10 26 11)" />
          <circle cx="20" cy="27" r="10.5" fill="currentColor" />
          <circle cx="16" cy="26" r="2.1" fill="#f6ecd2" />
          <circle cx="24" cy="26" r="2.1" fill="#f6ecd2" />
        </symbol>
        <symbol id="i-mouse" viewBox="0 0 40 40">
          <circle cx="9.5" cy="13" r="7.5" fill="currentColor" />
          <circle cx="30.5" cy="13" r="7.5" fill="currentColor" />
          <path fill="currentColor" d="M9 22 Q9 13 20 13 Q31 13 31 22 Q30 30 20 38 Q10 30 9 22 Z" />
          <circle cx="15.5" cy="22" r="2.1" fill="#f6ecd2" />
          <circle cx="24.5" cy="22" r="2.1" fill="#f6ecd2" />
        </symbol>
        <symbol id="i-bird" viewBox="0 0 40 40">
          <path fill="currentColor" d="M11 13 L8 3 L15 9 L18 2 L21 11 Z" />
          <circle cx="18" cy="22" r="11.5" fill="currentColor" />
          <path fill="currentColor" d="M27 17 L39 22 L27 27 Z" />
          <circle cx="21" cy="19" r="2.3" fill="#f6ecd2" />
        </symbol>
        <symbol id="i-any" viewBox="0 0 40 40">
          <text x="20" y="30" text-anchor="middle" font-family="Kurale, Georgia, serif" font-size="28" fill="currentColor">?</text>
        </symbol>
        <symbol id="i-gear" viewBox="0 0 40 40">
          <g fill="currentColor">
            <path fill-rule="evenodd" d="M8 20a12 12 0 1 0 24 0a12 12 0 1 0 -24 0Z M15 20a5 5 0 1 0 10 0a5 5 0 1 0 -10 0Z" />
            <rect x="17" y="3" width="6" height="8" rx="1" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(45 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(90 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(135 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(180 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(225 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(270 20 20)" />
            <rect x="17" y="3" width="6" height="8" rx="1" transform="rotate(315 20 20)" />
          </g>
        </symbol>
        <symbol id="i-cat" viewBox="0 0 40 40">
          <path fill="currentColor" d="M5 5 L14 12 Q20 10 26 12 L35 5 L34 21 Q33 33 20 36 Q7 33 6 21 Z" />
          <rect x="11.5" y="18" width="5" height="5" fill="#f6ecd2" />
          <rect x="23.5" y="18" width="5" height="5" fill="#f6ecd2" />
        </symbol>
        <symbol id="i-arm" viewBox="0 0 40 40">
          <path d="M9 35 H27 M18 35 V25 L11 15 L24 8 L31 13 M24 8 L28 3" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="18" cy="25" r="3.6" fill="currentColor" />
          <circle cx="11" cy="15" r="3.6" fill="currentColor" />
          <circle cx="24" cy="8" r="3.6" fill="currentColor" />
        </symbol>
        <symbol id="i-laurel" viewBox="0 0 40 40">
          <path d="M6 37 Q14 22 33 5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" />
          <g fill="var(--laurel)" stroke="var(--ink)" stroke-width="1.2">
            <ellipse cx="11" cy="25" rx="2.6" ry="6" transform="rotate(-20 11 25)" />
            <ellipse cx="19" cy="31" rx="2.6" ry="6" transform="rotate(70 19 31)" />
            <ellipse cx="16" cy="16" rx="2.6" ry="6" transform="rotate(-5 16 16)" />
            <ellipse cx="24" cy="22" rx="2.6" ry="6" transform="rotate(75 24 22)" />
            <ellipse cx="23" cy="9" rx="2.4" ry="5.4" transform="rotate(15 23 9)" />
            <ellipse cx="30" cy="14" rx="2.4" ry="5.4" transform="rotate(80 30 14)" />
          </g>
        </symbol>
        <symbol id="i-scroll" viewBox="0 0 40 40">
          <path d="M10 8 H30 Q34 8 34 12 V30 Q34 34 30 34 H12" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
          <path d="M10 8 Q6 8 6 12 Q6 16 10 16 H14 V12 Q14 8 10 8 Z" fill="currentColor" />
          <path d="M16 16 H28 M16 22 H28 M16 28 H24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>

    <!-- Небо: пора доби за фазою ходу (sky.js), сонце й місяць на дузі -->
    <div class="stars" aria-hidden="true"></div>
    <div class="celestial instant" id="celestial" aria-hidden="true">
      <div class="sun">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#ffd86b" opacity="0.25" />
          <g fill="#ffcf4d" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
              <polygon points="46.3,20.2 50.0,4.0 53.7,20.2" />
              <polygon points="61.7,22.4 73.0,10.2 68.1,26.0" />
              <polygon points="74.0,31.9 89.8,27.0 77.6,38.3" />
              <polygon points="79.8,46.3 96.0,50.0 79.8,53.7" />
              <polygon points="77.6,61.7 89.8,73.0 74.0,68.1" />
              <polygon points="68.1,74.0 73.0,89.8 61.7,77.6" />
              <polygon points="53.7,79.8 50.0,96.0 46.3,79.8" />
              <polygon points="38.3,77.6 27.0,89.8 31.9,74.0" />
              <polygon points="26.0,68.1 10.2,73.0 22.4,61.7" />
              <polygon points="20.2,53.7 4.0,50.0 20.2,46.3" />
              <polygon points="22.4,38.3 10.2,27.0 26.0,31.9" />
              <polygon points="31.9,26.0 27.0,10.2 38.3,22.4" />
          </g>
          <circle cx="50" cy="50" r="27" fill="#ffd86b" stroke="var(--ink)" stroke-width="2.5" />
          <circle cx="42" cy="42" r="9" fill="#fff1b8" opacity="0.7" />
        </svg>
      </div>
      <div class="moon">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#f3ead5" opacity="0.12" />
          <path
            d="M58 10 A40 40 0 1 0 90 66 A32 32 0 1 1 58 10 Z"
            fill="#f3ead5"
            stroke="var(--ink)"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <circle cx="40" cy="62" r="4" fill="#d9cfb4" />
          <circle cx="30" cy="44" r="2.6" fill="#d9cfb4" />
        </svg>
      </div>
    </div>
    <div class="forest" aria-hidden="true"><svg id="forest"></svg></div>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
